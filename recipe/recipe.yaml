context:
  name: vsgimgui
  version: "0.7.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/vsg-dev/vsgImGui/archive/v${{ version }}.tar.gz
  sha256: 016191dfa4953fd381990166cf7df6f1328ced02411afcc7387e9121bf825d92
  patches:
    - patches/0001-Add-options-to-use-system-dependencies.patch
    - patches/0003-Find-imgui-and-implot-in-package-config-when-system-.patch

build:
  number: 2
  script:
    - if: win
      then: call "%RECIPE_DIR%\\build.bat"
    - if: unix
      then: bash "${RECIPE_DIR}/build.sh"

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - if: not win
      then: ninja
    - if: linux
      then: pkgconfig
  host:
    - imgui >=1.91.8,<1.91.9.0a0
    - implot >=0.16,<0.17
    - libvulkan-headers
    - libvulkan-loader
    - vulkanscenegraph
  run_exports:
    - ${{ pin_subpackage('vsgimgui', upper_bound='x.x') }}

tests:
  - requirements:
      run:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - if: not win
          then: ninja
        - if: linux
          then: pkgconfig
        - vsgxchange
    files:
      recipe:
        - run_test.bat
        - run_test.sh
        - tests/
    script:
      - if: unix
        then:
          - test -f "${PREFIX}/include/vsgImGui/Export.h"
          - test -f "${PREFIX}/include/vsgImGui/imgui.h"
          - test -f "${PREFIX}/include/vsgImGui/implot.h"
          - test -f "${PREFIX}/lib/libvsgImGui${SHLIB_EXT}"
          - test -f "${PREFIX}/lib/cmake/vsgImGui/vsgImGuiConfig.cmake"
          - bash run_test.sh
      - if: win
        then:
          - if not exist "%PREFIX%\\Library\\include\\vsgImGui\\Export.h" exit 1
          - if not exist "%PREFIX%\\Library\\include\\vsgImGui\\imgui.h" exit 1
          - if not exist "%PREFIX%\\Library\\include\\vsgImGui\\implot.h" exit 1
          - if not exist "%PREFIX%\\Library\\lib\\vsgImGui.lib" exit 1
          - if not exist "%PREFIX%\\Library\\bin\\vsgImGui.dll" exit 1
          - if not exist "%PREFIX%\\Library\\lib\\cmake\\vsgImGui\\vsgImGuiConfig.cmake" exit 1
          - call run_test.bat

about:
  homepage: https://vsg-dev.github.io/vsg-dev.io/
  repository: https://github.com/vsg-dev/vsgImGui
  summary: Integration of VulkanSceneGraph with ImGui
  license: MIT
  license_file: LICENSE.md

extra:
  recipe-maintainers:
    - jeongseok-meta
